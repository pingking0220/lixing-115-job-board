<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>力行國小 115 學年度職務選填電子板</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="kicker">臺北市文山區力行國民小學</p>
        <h1>115 學年度職務選填電子板</h1>
      </div>
      <div class="summary" aria-live="polite">
        <span><strong id="availableCount">0</strong> 位待選</span>
        <span><strong id="pickedCount">0</strong> 位已選</span>
        <span><strong id="openCount">0</strong> 個空缺</span>
      </div>
    </header>

    <main class="layout">
      <aside class="teacher-panel">
        <div class="panel-head">
          <h2>選填順序</h2>
          <button id="clearSelection" class="ghost-button" type="button">取消選取</button>
        </div>
        <div id="teacherList" class="teacher-list" aria-label="參與選填教師名單"></div>
      </aside>

      <section class="board-wrap">
        <div class="action-strip">
          <div id="currentAction" class="current-action">請先點選教師姓名</div>
          <div class="actions">
            <button id="confirmButton" class="primary-button" type="button" disabled>確認</button>
            <button id="cancelButton" class="danger-button" type="button" disabled>取消</button>
            <button id="exportButton" class="ghost-button" type="button">匯出結果</button>
            <button id="resetButton" class="ghost-button" type="button">重設選填</button>
            <a class="ghost-link" href="./viewer.html" target="_blank" rel="noopener">觀看版</a>
          </div>
        </div>

        <div id="jobBoard" class="job-board" aria-label="職務選填表"></div>
      </section>
    </main>

    <dialog id="exportDialog" class="export-dialog">
      <form method="dialog">
        <div class="dialog-head">
          <h2>選填結果</h2>
          <button class="icon-button" value="close" aria-label="關閉">×</button>
        </div>
        <textarea id="exportText" readonly></textarea>
        <div class="dialog-actions">
          <button id="copyButton" class="primary-button" type="button">複製</button>
          <button class="ghost-button" value="close">關閉</button>
        </div>
      </form>
    </dialog>

    <script src="./app.js"></script>
  </body>
</html>
